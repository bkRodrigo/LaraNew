services:
  nginx:
    image: nginx:1.30-alpine
    ports:
      - "${FORWARD_HTTP_PORT:-80}:80"
    volumes:
      - ./public:/var/www/html/public:delegated
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - fpm

  fpm:
    build:
      context: .
      dockerfile: docker/fpm/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./:/var/www/html:delegated
